name: Deploy to Railway

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      SERVICE_ID: ${{ vars.RAILWAY_SERVICE_ID }}
      ENVIRONMENT_ID: ${{ vars.RAILWAY_ENVIRONMENT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Trigger Railway Deployment via API
        if: env.RAILWAY_TOKEN != '' && env.SERVICE_ID != '' && env.ENVIRONMENT_ID != ''
        run: |
          echo "Triggering Railway deployment... service=$SERVICE_ID env=$ENVIRONMENT_ID"
          RESPONSE=$(curl -s -X POST "https://backboard.railway.com/graphql/v2" \
            -H "Authorization: Bearer $RAILWAY_TOKEN" \
            -H "Content-Type: application/json" \
            -d "{\"query\": \"mutation { serviceInstanceDeploy(serviceId: \\\"${SERVICE_ID}\\\", environmentId: \\\"${ENVIRONMENT_ID}\\\") }\"}")
          echo "Response: $RESPONSE"
          if echo "$RESPONSE" | grep -q '"serviceInstanceDeploy":true'; then
            echo "✅ Railway deployment triggered successfully!"
          else
            echo "❌ Deployment trigger failed: $RESPONSE"
            exit 1
          fi

      # Auto-deploy belum dikonfigurasi → skip (bukan gagal), beri petunjuk.
      - name: Auto-deploy belum dikonfigurasi (skip)
        if: env.RAILWAY_TOKEN == '' || env.SERVICE_ID == '' || env.ENVIRONMENT_ID == ''
        run: |
          echo "ℹ️  Auto-deploy ke Railway belum dikonfigurasi — dilewati (tidak gagal)."
          echo ""
          echo "Cara mengaktifkan (setelah project Railway dibuat):"
          echo "  1. Railway → Account Settings → Tokens → Generate (scope: Deploy)"
          echo "  2. GitHub repo ini → Settings → Secrets and variables → Actions:"
          echo "       - Secret    : RAILWAY_TOKEN   = token Railway Anda"
          echo "       - Variables : RAILWAY_SERVICE_ID / RAILWAY_ENVIRONMENT_ID"
          echo "         (dari project Railway Anda — lihat DEPLOY_RAILWAY.md §6)"
          echo "  3. Push ulang atau jalankan workflow manual (Actions → Run workflow)."
